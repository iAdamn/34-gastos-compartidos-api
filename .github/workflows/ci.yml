# Revisa cada push y cada pull request: tipos, lint, formato, pruebas, build y dependencias.
# Firebase se simula en las pruebas, asi que la CI no necesita ninguna clave.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tipos, lint, formato y pruebas
        run: npm run check
      - name: Compilar
        run: npm run build
      - name: Dependencias con vulnerabilidades altas
        run: npm audit --audit-level=high

  secretos:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0 baja todo el historial: gitleaks revisa cada commit, no solo el ultimo.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Buscar claves en el historial con gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
